[package]
name = "midi_merger"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
midir = "0.11.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[package.metadata.winresource]
FileDescription = "MIDI merger - Unit pipe organ"
ProductName = "MIDI merger - Unit pipe organ"
LegalCopyright = "Copyright © 2026 Valentin Leroux"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
